name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run pytest
        run: pytest


  docker-publish:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    needs: test

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set application version
        id: version
        run: |
          VERSION=$(python -c 'import re; text=open("app/app.py").read(); print(re.search(r"\"version\":\s*\"([^\"]+)\"", text).group(1))')
          echo "Application version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t tholiwe/portfolio-project-3:${{ steps.version.outputs.version }} \
            -t tholiwe/portfolio-project-3:latest \
            .

      - name: Push versioned Docker image
        run: |
          docker push tholiwe/portfolio-project-3:${{ steps.version.outputs.version }}

      - name: Push latest Docker image
        run: |
          docker push tholiwe/portfolio-project-3:latest


  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: docker-publish

    steps:
      - name: Deploy Project 3 to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22

          script: |
            set -u

            VERSION="${{ needs.docker-publish.outputs.version }}"
            NEW_IMAGE="tholiwe/portfolio-project-3:$VERSION"
            CONTAINER="portfolio-project-3-api"

            echo "======================================"
            echo "Deploying Project 3 version $VERSION"
            echo "======================================"

            echo "Checking current deployment..."

            OLD_IMAGE=$(docker inspect "$CONTAINER" \
              --format '{{.Config.Image}}' 2>/dev/null || true)

            if [ -n "$OLD_IMAGE" ]; then
              echo "Previous image: $OLD_IMAGE"
            else
              echo "No previous deployment found."
            fi

            echo "Pulling new Docker image..."
            docker pull "$NEW_IMAGE"

            rollback() {
              echo "======================================"
              echo "DEPLOYMENT FAILED"
              echo "Starting rollback..."
              echo "======================================"

              docker stop "$CONTAINER" 2>/dev/null || true
              docker rm "$CONTAINER" 2>/dev/null || true

              if [ -n "$OLD_IMAGE" ]; then
                echo "Restoring previous image: $OLD_IMAGE"

                docker pull "$OLD_IMAGE"

                docker run -d \
                  --name "$CONTAINER" \
                  --restart unless-stopped \
                  -p 80:5000 \
                  "$OLD_IMAGE"

                sleep 5

                if curl --fail http://localhost/health; then
                  echo "Rollback successful."
                else
                  echo "Rollback health check failed."
                  exit 1
                fi
              else
                echo "No previous image available for rollback."
                exit 1
              fi
            }

            echo "Stopping old container..."
            docker stop "$CONTAINER" 2>/dev/null || true

            echo "Removing old container..."
            docker rm "$CONTAINER" 2>/dev/null || true

            echo "Starting new container..."
            if ! docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p 80:5000 \
              "$NEW_IMAGE"; then

              rollback
              exit 1
            fi

            echo "Waiting for application..."
            sleep 5

            echo "Running health check..."

            if ! curl --fail http://localhost/health; then
              rollback
              exit 1
            fi

            echo "Checking deployed version..."

            if ! curl --fail http://localhost/version; then
              rollback
              exit 1
            fi

            echo "======================================"
            echo "Deployment successful!"
            echo "Running image: $NEW_IMAGE"
            echo "======================================"
