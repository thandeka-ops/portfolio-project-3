name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run pytest
        run: pytest


  build-and-publish:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    needs: test

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get application version
        id: version
        run: |
          VERSION=$(grep '"version"' app/app.py | head -1 | sed -E 's/.*"version": "([^"]+)".*/\1/')
          echo "Application version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t tholiwe/portfolio-project-3:${{ steps.version.outputs.version }} \
            -t tholiwe/portfolio-project-3:latest \
            .

      - name: Push versioned Docker image
        run: |
          docker push tholiwe/portfolio-project-3:${{ steps.version.outputs.version }}

      - name: Push latest Docker image
        run: |
          docker push tholiwe/portfolio-project-3:latest


  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: build-and-publish

    steps:
      - name: Deploy Project 3 to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22

          script: |
            set -e

            VERSION="${{ needs.build-and-publish.outputs.version }}"

            echo "======================================"
            echo "Deploying Project 3 version $VERSION"
            echo "======================================"

            echo "Checking current deployment..."

            PREVIOUS_IMAGE=$(docker inspect portfolio-project-3-api \
              --format '{{.Config.Image}}' 2>/dev/null || echo "")

            echo "Previous image: $PREVIOUS_IMAGE"

            echo "Pulling new Docker image..."

            docker pull tholiwe/portfolio-project-3:$VERSION

            echo "Stopping old container..."

            docker stop portfolio-project-3-api || true

            echo "Removing old container..."

            docker rm portfolio-project-3-api || true

            echo "Starting new container..."

            docker run -d \
              --name portfolio-project-3-api \
              --restart unless-stopped \
              -p 127.0.0.1:5000:5000 \
              tholiwe/portfolio-project-3:$VERSION

            echo "Waiting for application..."

            sleep 5

            echo "Running health check..."

            if curl --fail http://localhost/health; then

              echo ""
              echo "======================================"
              echo "DEPLOYMENT SUCCESSFUL"
              echo "Version $VERSION is healthy"
              echo "======================================"

            else

              echo ""
              echo "======================================"
              echo "DEPLOYMENT FAILED"
              echo "Starting rollback..."
              echo "======================================"

              docker stop portfolio-project-3-api || true
              docker rm portfolio-project-3-api || true

              if [ -n "$PREVIOUS_IMAGE" ]; then

                echo "Restoring previous image: $PREVIOUS_IMAGE"

                docker pull "$PREVIOUS_IMAGE"

                docker run -d \
                  --name portfolio-project-3-api \
                  --restart unless-stopped \
                  -p 127.0.0.1:5000:5000 \
                  "$PREVIOUS_IMAGE"

                sleep 5

                if curl --fail http://localhost/health; then

                  echo ""
                  echo "======================================"
                  echo "ROLLBACK SUCCESSFUL"
                  echo "Previous version restored"
                  echo "======================================"

                else

                  echo ""
                  echo "======================================"
                  echo "ROLLBACK FAILED"
                  echo "======================================"

                  exit 1

                fi

              else

                echo "No previous image found."
                echo "Cannot perform rollback."

                exit 1

              fi

              exit 1

            fi
