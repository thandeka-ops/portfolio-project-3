name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run pytest
        run: pytest


  build-and-publish:
    name: Build and Publish Docker Image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: test

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get application version
        id: version
        run: |
          VERSION=$(grep '"version"' app/app.py | head -1 | sed -E 's/.*"version": "([^"]+)".*/\1/')
          echo "Application version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t tholiwe/portfolio-project-3:${{ steps.version.outputs.version }} \
            -t tholiwe/portfolio-project-3:latest \
            .

      - name: Push versioned Docker image
        run: |
          docker push tholiwe/portfolio-project-3:${{ steps.version.outputs.version }}

      - name: Push latest Docker image
        run: |
          docker push tholiwe/portfolio-project-3:latest


  deploy:
    name: Deploy to AWS EC2
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-and-publish

    env:
      AWS_REGION: eu-north-1
      EC2_INSTANCE_ID: i-00dbb42c5b92bc8c8

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActionsProject3

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Prepare deployment script
        env:
          VERSION: ${{ needs.build-and-publish.outputs.version }}
        run: |

          cat > deploy.sh <<'SCRIPT'

          set -e

          VERSION="__VERSION__"

          echo "======================================"
          echo "Deploying Project 3 version $VERSION"
          echo "======================================"

          PREVIOUS_IMAGE=$(docker inspect portfolio-project-3-api \
            --format '{{.Config.Image}}' 2>/dev/null || echo "")

          echo "Previous image: $PREVIOUS_IMAGE"

          echo "Pulling new Docker image..."

          docker pull tholiwe/portfolio-project-3:$VERSION

          echo "Stopping old container..."

          docker stop portfolio-project-3-api || true

          echo "Removing old container..."

          docker rm portfolio-project-3-api || true

          echo "Starting new container..."

          docker run -d \
            --name portfolio-project-3-api \
            --restart unless-stopped \
            -p 127.0.0.1:5000:5000 \
            tholiwe/portfolio-project-3:$VERSION

          echo "Waiting for application..."

          sleep 5

          echo "Running health check..."

          if curl --fail http://localhost/health; then

            echo "======================================"
            echo "DEPLOYMENT SUCCESSFUL"
            echo "Version $VERSION is healthy"
            echo "======================================"

            exit 0
          fi

          echo "======================================"
          echo "DEPLOYMENT FAILED"
          echo "Starting rollback..."
          echo "======================================"

          docker stop portfolio-project-3-api || true
          docker rm portfolio-project-3-api || true

          if [ -n "$PREVIOUS_IMAGE" ]; then

            echo "Restoring previous image: $PREVIOUS_IMAGE"

            docker pull "$PREVIOUS_IMAGE"

            docker run -d \
              --name portfolio-project-3-api \
              --restart unless-stopped \
              -p 127.0.0.1:5000:5000 \
              "$PREVIOUS_IMAGE"

            sleep 5

            if curl --fail http://localhost/health; then

              echo "======================================"
              echo "ROLLBACK SUCCESSFUL"
              echo "Previous version restored"
              echo "======================================"

            else

              echo "ROLLBACK FAILED"
              exit 1

            fi

          else

            echo "No previous image found."
            exit 1

          fi

          exit 1

          SCRIPT

          sed -i "s/__VERSION__/${VERSION}/g" deploy.sh

          echo "Deployment script prepared."
          grep '^VERSION=' deploy.sh


      - name: Send deployment command through SSM
        id: send-command
        run: |

          SCRIPT_B64=$(base64 -w 0 deploy.sh)

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Project 3 version ${{ needs.build-and-publish.outputs.version }}" \
            --parameters "commands=echo $SCRIPT_B64 | base64 -d | bash" \
            --timeout-seconds 600 \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"


      - name: Wait for deployment
        run: |

          COMMAND_ID="${{ steps.send-command.outputs.command_id }}"

          echo "Waiting for SSM deployment..."

          for i in {1..60}; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text)

            echo "SSM status: $STATUS"

            case "$STATUS" in

              Success)
                echo "Deployment completed successfully."
                exit 0
                ;;

              Failed|Cancelled|TimedOut|Cancelling)
                echo "Deployment failed with status: $STATUS"
                exit 1
                ;;

              *)
                sleep 5
                ;;

            esac

          done

          echo "Deployment timed out waiting for SSM."
          exit 1


      - name: Show deployment output
        if: always()
        run: |

          COMMAND_ID="${{ steps.send-command.outputs.command_id }}"

          echo "======================================"
          echo "SSM STANDARD OUTPUT"
          echo "======================================"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardOutputContent" \
            --output text || true

          echo ""
          echo "======================================"
          echo "SSM ERROR OUTPUT"
          echo "======================================"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "StandardErrorContent" \
            --output text || true
