name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Run pytest
        run: pytest


  docker-publish:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    needs: test

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set application version
        id: version
        run: |
          VERSION=$(python -c 'import re; text=open("app/app.py").read(); print(re.search(r"\"version\":\s*\"([^\"]+)\"", text).group(1))')
          echo "Application version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t tholiwe/portfolio-project-3:${{ steps.version.outputs.version }} \
            -t tholiwe/portfolio-project-3:latest \
            .

      - name: Push versioned Docker image
        run: |
          docker push tholiwe/portfolio-project-3:${{ steps.version.outputs.version }}

      - name: Push latest Docker image
        run: |
          docker push tholiwe/portfolio-project-3:latest


  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: docker-publish

    steps:
      - name: Deploy Project 3 to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e

            VERSION="${{ needs.docker-publish.outputs.version }}"

            echo "Deploying Project 3 version $VERSION..."

            echo "Pulling versioned Docker image..."
            docker pull tholiwe/portfolio-project-3:$VERSION

            echo "Stopping old container..."
            docker stop portfolio-project-3-api || true

            echo "Removing old container..."
            docker rm portfolio-project-3-api || true

            echo "Starting Project 3 version $VERSION..."
            docker run -d \
              --name portfolio-project-3-api \
              --restart unless-stopped \
              -p 80:5000 \
              tholiwe/portfolio-project-3:$VERSION

            echo "Waiting for application..."
            sleep 5

            echo "Running health check..."
            curl --fail http://localhost/health

            echo "Checking deployed version..."
            DEPLOYED_VERSION=$(curl --fail -s http://localhost/version)

            echo "Application response:"
            echo "$DEPLOYED_VERSION"

            echo "Deployment of version $VERSION successful!"
